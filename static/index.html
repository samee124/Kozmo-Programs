  @keyframes fadeUp { from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)} }
  .fade-up { animation:fadeUp .35s ease both }
</style>
</head>

            React.createElement('span', { style:{ fontSize:10.5, fontWeight:500, padding:'2px 7px', borderRadius:99, background:ss, color:sc, letterSpacing:'0.04em', fontFamily:'Geist Mono, monospace' } }, (vendor.status||'UNKNOWN').toUpperCase()),
            vendor.health_band && React.createElement('span', { style:{ fontSize:10.5, fontWeight:500, padding:'2px 7px', borderRadius:99, background:healthSoft(vendor.health_band), color:healthColor(vendor.health_band), letterSpacing:'0.04em', fontFamily:'Geist Mono, monospace' } }, vendor.health_band)
          ),
          React.createElement('h2', { style:{ margin:'6px 0 0', fontSize:22, fontWeight:600, letterSpacing:'-0.02em', lineHeight:1.2 } }, vendor.vendor_name),
          vendor.cri_score!=null
            ? React.createElement('div', { style:{ marginTop:4, fontSize:13, color:'var(--ink-3)' } },
                'CRI Score: ',
                React.createElement('span', { style:{ fontWeight:600, color:vendor.cri_score>=70?'var(--ok)':vendor.cri_score>=45?'var(--warn)':'var(--err)', fontFamily:'Geist Mono, monospace' } },
                  typeof vendor.cri_score==='number' ? vendor.cri_score.toFixed(1) : vendor.cri_score
                ),
                vendor.health_band ? ' · '+vendor.health_band : ''
              )
            : React.createElement('div', { style:{ marginTop:4, fontSize:13, color:'var(--ink-3)' } }, vendor.data_class||'CLASS_D')
        ),
        React.createElement('button', { onClick:props.onClose, style:{ background:'var(--bg-2)', border:'1px solid var(--line)', borderRadius:7, padding:7, cursor:'pointer', display:'grid', placeItems:'center', color:'var(--ink-2)', flexShrink:0 } }, React.createElement(Icon.X))
      ),

      /* tabs */
      React.createElement('div', { style:{ display:'flex', borderBottom:'1px solid var(--line)', background:'var(--surface-2)', overflowX:'auto' } },
        DRAWER_TABS.map(function(t) {
          var avail = vendor.files && vendor.files[t.k];
          return React.createElement('button', { key:t.k, onClick:function(){ setTab(t.k); }, style:{ padding:'10px 16px', fontSize:12.5, fontWeight:500, border:'none', borderBottom:tab===t.k?'2px solid var(--accent)':'2px solid transparent', background:'transparent', color:tab===t.k?'var(--accent)':'var(--ink-3)', cursor:'pointer', whiteSpace:'nowrap', opacity:avail?1:0.4 } },
            t.label, !avail && React.createElement('span', { style:{ marginLeft:4, fontSize:10, color:'var(--ink-4)' } }, '—')
          );
        })
      ),

      /* file content */
      React.createElement('div', { style:{ flex:1, overflowY:'auto' } },
        loadingFile
          ? React.createElement('div', { style:{ padding:24, textAlign:'center', color:'var(--ink-4)', fontSize:13 } }, 'Loading…')
          : React.createElement('pre', { style:{ margin:0, padding:'18px 24px', fontFamily:'Geist Mono, monospace', fontSize:12, lineHeight:1.7, color:'var(--ink-2)', background:'transparent', whiteSpace:'pre-wrap', wordBreak:'break-word' } }, fileContent)
      ),

      /* footer */
      React.createElement('div', { style:{ padding:'14px 24px', borderTop:'1px solid var(--line)', background:'var(--surface-2)', display:'flex', justifyContent:'space-between', alignItems:'center', gap:12 } },
        React.createElement('div', { style:{ fontSize:11.5, color:'var(--ink-3)', fontFamily:'Geist Mono, monospace' } },
          'press ', React.createElement('span', { style:{ padding:'1px 5px', border:'1px solid var(--line-2)', borderRadius:3 } }, 'esc'), ' to close'
        ),
        React.createElement('div', { style:{ fontSize:11.5, color:'var(--ink-4)', fontFamily:'Geist Mono, monospace' } }, progId+' / '+vendor.vendor_id)
      )
    )
  );
}

/* ── App root ────────────────────────────────────────────────────── */
function App() {
  var _view = useState('config'); var view = _view[0]; var setView = _view[1];
  var _run = useState(null); var run = _run[0]; var setRun = _run[1];
  var _progs = useState([]); var programmes = _progs[0]; var setProgrammes = _progs[1];

  function loadProgrammes() {
    fetch('/api/programmes')
      .then(function(r){ return r.json(); })
      .then(function(data){ setProgrammes(data||[]); })
      .catch(function(){});
  }

  useEffect(function() { loadProgrammes(); }, []);

  function handleStart(cfg) {
    var fd = new FormData();
    fd.append('programme_id', cfg.progId);
    fd.append('own_company', cfg.company);
    fd.append('vendor_list', cfg.vendorFile, cfg.vendorFile.name);
    if (cfg.docs) cfg.docs.forEach(function(f){ fd.append('documents', f, f.name); });

    fetch('/api/run', { method:'POST', body:fd })
      .then(function(r){ return r.json(); })
      .then(function(data) {
        if (data.error) { alert('Error: '+data.error); return; }
        setRun({ progId:data.programme_id, company:cfg.company, runId:data.run_id });
        setView('progress');
      })
      .catch(function(e){ alert('Failed to start pipeline: '+e.message); });
  }

  function handleComplete() {
    loadProgrammes();
    setView('results');
  }

  function handleSelectProgramme(p) {
    setRun({ progId:p.programme_id, company:'', runId:null });
    setView('results');
  }

  return React.createElement('div', { style:{ display:'flex', height:'100vh', overflow:'hidden' } },
    React.createElement(Sidebar, {
      view:view,
      programmes:programmes,
      activeId:run && run.progId,
      onNewRun:function(){ setView('config'); },
      onSelectProgramme:handleSelectProgramme,
    }),
    React.createElement('main', { style:{ flex:1, overflowY:'auto', background:'var(--bg)' } },
      view==='config' && React.createElement(ConfigView, { onStart:handleStart }),
      view==='progress' && run && React.createElement(ProgressView, {
        progId:run.progId,
        company:run.company,
        runId:run.runId,
        onNewRun:function(){ setView('config'); },
        onComplete:handleComplete,
      }),
      view==='results' && run && React.createElement(ResultsView, {
        progId:run.progId,
        company:run.company||'',
        onNewRun:function(){ setView('config'); },
      })
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
