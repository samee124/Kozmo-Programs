<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cobalt — Programmes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .card-hover { transition: box-shadow 0.15s, transform 0.15s; }
    .card-hover:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.10); transform: translateY(-2px); }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 px-8 py-4 flex items-center gap-3">
    <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center">
      <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
      </svg>
    </div>
    <span class="text-xl font-bold text-gray-900 tracking-tight">Cobalt</span>
    <span class="ml-2 text-gray-400 text-sm">Vendor Intelligence</span>
  </header>

  <!-- Main -->
  <main class="max-w-5xl mx-auto px-6 py-10">
    <div class="mb-8">
      <h1 class="text-2xl font-bold text-gray-900">Programmes</h1>
      <p class="text-gray-500 mt-1 text-sm">Select a programme to view its vendor portfolio.</p>
    </div>

    <div id="loading" class="text-gray-400 text-sm">Loading programmes…</div>
    <div id="error" class="hidden text-red-500 text-sm"></div>
    <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
  </main>

  <script>
    async function load() {
      const grid = document.getElementById('grid');
      const loading = document.getElementById('loading');
      const errEl = document.getElementById('error');
      try {
        const res = await fetch('/api/programmes');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const programmes = await res.json();
        loading.classList.add('hidden');
        if (programmes.length === 0) {
          grid.innerHTML = '<p class="text-gray-400 text-sm col-span-3">No programmes found.</p>';
          return;
        }
        grid.innerHTML = programmes.map(p => `
          <a href="/programme?prog=${p.id}" class="card-hover bg-white rounded-xl border border-gray-200 p-6 block cursor-pointer">
            <div class="flex items-start justify-between">
              <div>
                <div class="text-xs font-mono text-indigo-500 mb-1">${p.id}</div>
                <div class="text-lg font-semibold text-gray-900">${p.label}</div>
              </div>
              <div class="w-10 h-10 bg-indigo-50 rounded-lg flex items-center justify-center text-indigo-600 font-bold text-sm">
                ${p.vendor_count}
              </div>
            </div>
            <div class="mt-4 text-sm text-gray-500">${p.vendor_count} vendor${p.vendor_count !== 1 ? 's' : ''}</div>
          </a>
        `).join('');
      } catch (e) {
        loading.classList.add('hidden');
        errEl.textContent = 'Failed to load programmes: ' + e.message;
        errEl.classList.remove('hidden');
      }
    }
    load();
  </script>
</body>
</html>
