[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "Cobalt"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "openai",
    "sqlalchemy>=2.0",
    "asyncpg",
    "psycopg2-binary",
    "python-dotenv",
    "tenacity",
    "firecrawl-py",
    "duckduckgo_search",
    "pyyaml",
    "pypdf",
    "openpyxl",
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
